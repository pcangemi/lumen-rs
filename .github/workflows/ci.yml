name: Rust checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    name: check (macos-26)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release --bins
      - name: Render a scene and validate the viewer drawing
        run: |
          ./target/release/lumen-rs --backend cpu --scene-file scenes/glass-study.json --width 96 --height 64 --samples 8 --output renders/smoke.png --exr
          ./target/release/viewer --headless-preview renders/viewer-smoke.png --width 96 --height 64 --samples 8
