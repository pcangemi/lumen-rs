[package]
name = "lumen-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "lumen-rs"
description = "Physically based Rust path tracer with native Apple Metal compute"
license = "MIT"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
glam = { version = "0.30", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "exr"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tobj = "4"
minifb = { version = "0.28", default-features = false, features = ["x11"] }
font8x8 = "0.3"
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
metal = "0.33"
objc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
lto = "thin"
codegen-units = 1
